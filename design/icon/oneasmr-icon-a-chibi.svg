<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 图标设计稿 A ——「精修 Q 版听音少女」  (v2)

  相对旧图标（54 条路径）与 v1 草稿的改动：
    * 头发成为主体：饱满后发 + 中分帘式刘海（发际线降到额头以下），脸只占下半部
    * 双马尾改成有体积的锥形，从头顶两侧甩出、在下巴以下收成尖端；耳罩压在
      马尾上方，马尾从耳罩后穿过——这正是"戴耳机的双马尾"该有的层次
    * 耳罩去掉品红圈（v1 里它和脸抢"眼睛"），改奶白壳 + 深蓝内盘 + 一点品红芯
    * 粉色发圈移回马尾根部（v1 误画在额头上）
    * 删掉麦克风、发丝高光、同心圆环、内部阴影

  自适应图标：108×108；#background-layer = ic_launcher_background，
  #glyph-layer = ic_launcher_foreground（识别内容全部在中心 r≈35 安全圆内）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 图标 A：戴耳机的 Q 版少女">
  <title>OneAsmr — A「精修 Q 版听音少女」</title>

  <defs>
    <radialGradient id="a-bg" cx="50%" cy="44%" r="66%">
      <stop offset="0%" stop-color="#2E4A82"/>
      <stop offset="55%" stop-color="#182A55"/>
      <stop offset="100%" stop-color="#0D1730"/>
    </radialGradient>
    <linearGradient id="a-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BEDE1"/>
      <stop offset="100%" stop-color="#2AB0A7"/>
    </linearGradient>
    <linearGradient id="a-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4DEF4"/>
    </linearGradient>
    <!-- 双马尾：只画右侧，左侧镜像复用（左右严格对称） -->
    <path id="a-tail"
          d="M64,34 C77,31 88,41 88,55 C88,66 84,74 78,79 C75.6,81.6 72.6,80.4 73.2,77
             C75.6,67 75,56 70,48 C67.6,44 65.4,39 64,34 Z"/>
  </defs>

  <!-- ================= 背景层（ic_launcher_background） ================= -->
  <g id="background-layer">
    <rect width="108" height="108" fill="url(#a-bg)"/>
    <circle cx="54" cy="52" r="34" fill="#8FB4FF" opacity="0.06"/>
  </g>

  <!-- ================= 图形层（ic_launcher_foreground） ================= -->
  <g id="glyph-layer">

    <!-- 双马尾（在头部之后） -->
    <g id="tails" fill="url(#a-hair)">
      <use href="#a-tail"/>
      <use href="#a-tail" transform="translate(108,0) scale(-1,1)"/>
    </g>

    <!-- 后发：饱满的鹅蛋形，脸压在它上面 -->
    <ellipse id="hair-back" cx="54" cy="50" rx="21" ry="20" fill="url(#a-hair)"/>

    <!-- 脸：带下巴的圆弧形 -->
    <path id="face" fill="#FFE9DC"
          d="M39.5,55 C39.5,47 46,42 54,42 C62,42 68.5,47 68.5,55
             C68.5,63.5 62,70 54,70 C46,70 39.5,63.5 39.5,55 Z"/>

    <!-- 腮红 -->
    <g id="blush" fill="#FF9FB4" opacity="0.42">
      <ellipse cx="42.5" cy="62.5" rx="3.2" ry="1.8"/>
      <ellipse cx="65.5" cy="62.5" rx="3.2" ry="1.8"/>
    </g>

    <!-- 闭眼（放松的 ⌒）与微笑 -->
    <g id="face-features" fill="none" stroke="#232B4A" stroke-linecap="round">
      <path d="M42.8,56.6 C44.4,53 48.6,53 50.2,56.6" stroke-width="2"/>
      <path d="M57.8,56.6 C59.4,53 63.6,53 65.2,56.6" stroke-width="2"/>
      <path d="M51.8,63.2 C53,64.6 55,64.6 56.2,63.2" stroke-width="1.5"/>
    </g>

    <!-- 刘海：中分帘式，两缕垂到眼角、中间起分缝 -->
    <path id="bangs" fill="url(#a-hair)"
          d="M33.6,54 C33.6,39.5 42.6,30.5 54,30.5 C65.4,30.5 74.4,39.5 74.4,54
             C71.4,47.6 67.4,45.6 64.4,48.2 C63.2,43.6 59.6,40.8 56.2,40.4
             C55.6,38 52.4,38 51.8,40.4 C48.4,40.8 44.8,43.6 43.6,48.2
             C40.6,45.6 36.6,47.6 33.6,54 Z"/>

    <!-- 粉色发圈：扎在马尾根部（从耳罩上方露出一点） -->
    <g id="hair-ties" stroke="#FF73B5" stroke-width="3.4" stroke-linecap="round">
      <path d="M67.6,39.6 L71.6,44.2"/>
      <path d="M40.4,39.6 L36.4,44.2"/>
    </g>

    <!-- 耳机头梁：贴着头发压在头顶（不是悬在头上方的光环） -->
    <path id="headband" d="M32,55 A22,22 0 0 1 76,55"
          fill="none" stroke="url(#a-cream)" stroke-width="3.6" stroke-linecap="round"/>

    <!-- 耳罩：奶白外壳 + 深蓝内盘 + 品红芯（压在马尾之上） -->
    <g id="ear-cups">
      <ellipse cx="30.5" cy="56" rx="6.3" ry="7.8" fill="url(#a-cream)"/>
      <ellipse cx="77.5" cy="56" rx="6.3" ry="7.8" fill="url(#a-cream)"/>
      <ellipse cx="30.5" cy="56" rx="3.9" ry="5.1" fill="#25305A"/>
      <ellipse cx="77.5" cy="56" rx="3.9" ry="5.1" fill="#25305A"/>
      <circle cx="30.5" cy="56" r="1.5" fill="#FF73B5"/>
      <circle cx="77.5" cy="56" r="1.5" fill="#FF73B5"/>
    </g>

    <!-- 领口：略宽的白上衣肩线 + 青绿 V 领（旧图领带的简化） -->
    <g id="collar">
      <path d="M39,84.5 C39,78 45.5,74 54,74 C62.5,74 69,78 69,84.5
               C63,87 45,87 39,84.5 Z" fill="#E9EEFB"/>
      <path d="M47.4,74.2 L54,80 L60.6,74.2" fill="none" stroke="#3FCFC4"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 两点"酥麻"星芒（可去掉） -->
    <g id="sparkles" fill="#D6F8F2">
      <path d="M29.8,31.6 C30.3,33.9 30.6,34.2 32.9,34.7 C30.6,35.2 30.3,35.5 29.8,37.8
               C29.3,35.5 29,35.2 26.7,34.7 C29,34.2 29.3,33.9 29.8,31.6 Z"/>
      <path d="M78.2,31.6 C78.7,33.9 79,34.2 81.3,34.7 C79,35.2 78.7,35.5 78.2,37.8
               C77.7,35.5 77.4,35.2 75.1,34.7 C77.4,34.2 77.7,33.9 78.2,31.6 Z"/>
    </g>
  </g>
</svg>
