<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 标志稿 F ——「耳与波纹」（实验稿）

  ASMR 最直接的语义是"听"。这里把耳朵抽象成两条描边曲线（外耳廓 + 内耳脊），
  左侧两道青绿波纹表示"声音进入耳朵"。线条风格在不同尺寸下都稳定，
  但辨识度依赖耳朵形状画得准不准——属于需要看图判断的一稿。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 标志 F：耳朵与波纹">
  <title>OneAsmr — F「耳与波纹」</title>
  <defs>
    <radialGradient id="f-bg" cx="50%" cy="44%" r="66%">
      <stop offset="0%" stop-color="#2E4A82"/>
      <stop offset="55%" stop-color="#182A55"/>
      <stop offset="100%" stop-color="#0D1730"/>
    </radialGradient>
    <linearGradient id="f-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4DEF4"/>
    </linearGradient>
  </defs>

  <g id="background-layer">
    <rect width="108" height="108" fill="url(#f-bg)"/>
    <circle cx="54" cy="52" r="33" fill="#8FB4FF" opacity="0.06"/>
  </g>

  <g id="glyph-layer" fill="none" stroke-linecap="round">
    <!-- 外耳廓 -->
    <path d="M58,30 C68,30 76,38 76,49 C76,57 71,62 66,67 C61,72 60,76 60,81
             C60,87 56,91 51,90 C47,89 45,86 45,82"
          stroke="url(#f-cream)" stroke-width="5"/>
    <!-- 内耳脊 -->
    <path d="M61,44 C67,45 69,51 65,55 C62,58 57,56 57,52"
          stroke="url(#f-cream)" stroke-width="3.8"/>
    <!-- 声音波纹 -->
    <path d="M40,44 A13,13 0 0 0 40,64" stroke="#4FDCD0" stroke-width="3.8"/>
    <path d="M32,37 A21,21 0 0 0 32,71" stroke="#4FDCD0" stroke-width="3.8"/>
  </g>
</svg>
