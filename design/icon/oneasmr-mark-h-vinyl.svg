<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 标志稿 H ——「玻璃唱片」（趋势：音频母题 + 玻璃边缘高光）

  黑胶/唱片是音频类最稳的母题之一。这里按当下语言重做：
    * 唱片本体用"深色玻璃"渐变（#1A2444 → #0B1024），靠左上角一道边缘高光
      把它从深蓝底上"切"出来——Liquid Glass 那套边缘光 + 内发光的做法
    * 纹路只用两圈极淡的白环，不做密集沟槽（小尺寸会糊）
    * 中心标签用琥珀→品红的品牌渐变，唯一的高饱和色块就是视觉焦点
  自适应图标：背景层 = 底色 + 环境光，图形层 = 唱片。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 标志 H：玻璃唱片">
  <title>OneAsmr — H「玻璃唱片」</title>

  <defs>
    <radialGradient id="h-bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#1C2E60"/>
      <stop offset="58%" stop-color="#0F1B3A"/>
      <stop offset="100%" stop-color="#070D1E"/>
    </radialGradient>
    <radialGradient id="h-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB25E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB25E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-disc" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2C3C6C"/>
      <stop offset="55%" stop-color="#18213F"/>
      <stop offset="100%" stop-color="#0C1226"/>
    </linearGradient>
    <linearGradient id="h-label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD79A"/>
      <stop offset="100%" stop-color="#FF73B5"/>
    </linearGradient>
  </defs>

  <g id="background-layer">
    <rect width="108" height="108" fill="url(#h-bg)"/>
    <circle cx="54" cy="54" r="44" fill="url(#h-ambient)"/>
  </g>

  <g id="glyph-layer">
    <!-- 唱片 -->
    <circle cx="54" cy="54" r="30" fill="url(#h-disc)"/>
    <!-- 纹路 -->
    <circle cx="54" cy="54" r="24.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.3"/>
    <circle cx="54" cy="54" r="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.085" stroke-width="1.3"/>
    <!-- 玻璃边缘高光（左上，收短收细，别抢中心标签） -->
    <path d="M35,43 A30,30 0 0 1 63,26" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.5" stroke-width="2.1" stroke-linecap="round"/>
    <!-- 右下反向补光，避免下半圈发虚 -->
    <path d="M78.5,62 A30,30 0 0 1 64,80" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 中心标签 + 主轴孔 -->
    <circle cx="54" cy="54" r="10.5" fill="url(#h-label)"/>
    <circle cx="54" cy="54" r="2.4" fill="#0A1024"/>
  </g>
</svg>
