<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 风格探索 T ——「螺旋声纹」（螺旋）

  一条阿基米德螺旋（半径 3.5 → 29，2.5 圈，160 点折线）从中心甩到外圈，
  用青绿→青→暖金的斜向渐变描边，再叠两层低透明度描边做出辉光。
  它把"唱片沟槽"抽象成一条连续的线——没有唱片本体，也没有唱针，
  只是一条在暗处发光的螺纹。小尺寸下读成一个旋转的光环。
-->
