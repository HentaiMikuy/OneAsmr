<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 风格探索 P ——「点阵声波」（粒子/点阵语言）  v2

  v1 的两个问题：按 x 等距取样会让圆点在波峰处挤成一坨；点径不变时整条波形
  读成"随机散点"。v2 改为**沿曲线弧长等距**取样（22 点、间距 4.13），
  点径随振幅从 1.4 增到 2.1，两端正好收在水平线上。
  颜色沿用品牌三段渐变（青绿 → 青 → 暖金）；落成圆点后质感与 L 的霓虹实线完全不同。
  坐标由正弦曲线 + 振幅线性包络按弧长取样算出，非手摆。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 风格 P：点阵声波">
  <title>OneAsmr — P「点阵声波」</title>

  <defs>
    <radialGradient id="p-bg" cx="50%" cy="46%" r="74%">
      <stop offset="0%" stop-color="#152444"/>
      <stop offset="62%" stop-color="#0B1428"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <radialGradient id="p-ambient" cx="52%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#4FE0D8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4FE0D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background-layer">
    <rect width="108" height="108" fill="url(#p-bg)"/>
    <circle cx="52" cy="54" r="40" fill="url(#p-ambient)"/>
  </g>

  <g id="glyph-layer">
    <g fill="#3FD9CE">
      <circle cx="25.0" cy="54.0" r="1.40"/>
      <circle cx="27.8" cy="51.0" r="1.43"/>
      <circle cx="30.8" cy="48.1" r="1.47"/>
      <circle cx="34.5" cy="46.4" r="1.50"/>
      <circle cx="38.2" cy="47.9" r="1.53"/>
      <circle cx="41.0" cy="51.0" r="1.57"/>
      <circle cx="43.3" cy="54.4" r="1.60"/>
      <circle cx="45.5" cy="57.9" r="1.63"/>
    </g>
    <g fill="#6FE7F5">
      <circle cx="47.8" cy="61.3" r="1.67"/>
      <circle cx="50.8" cy="64.1" r="1.70"/>
      <circle cx="54.7" cy="63.8" r="1.73"/>
      <circle cx="57.4" cy="60.7" r="1.77"/>
      <circle cx="59.5" cy="57.1" r="1.80"/>
      <circle cx="61.3" cy="53.4" r="1.83"/>
      <circle cx="63.1" cy="49.7" r="1.87"/>
    </g>
    <g fill="#FFD08A">
      <circle cx="64.9" cy="46.0" r="1.90"/>
      <circle cx="67.2" cy="42.5" r="1.93"/>
      <circle cx="70.5" cy="40.5" r="1.97"/>
      <circle cx="73.8" cy="42.8" r="2.00"/>
      <circle cx="75.8" cy="46.4" r="2.03"/>
      <circle cx="77.5" cy="50.2" r="2.07"/>
      <circle cx="79.0" cy="54.0" r="2.10"/>
    </g>
  </g>
</svg>
