      <path d="M46.06,64.92 L38.75,75.0"/>
      <path d="M43.08,61.94 L33.07,69.21"/>
      <path d="M41.16,58.17 L31.07,61.45"/>
    </g>
    <circle cx="54" cy="54" r="5.4" fill="#FFFFFF"/>
  </g>
</svg>
