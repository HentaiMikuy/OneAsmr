<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 风格探索 M ——「字母 O」（品牌字母 + 极简符号）

  参照国内音乐 App 换标时最常用的一招：把品牌首字母做成图形（QQ 音乐的
  Q 里嵌音符、百度音乐的 Q + 音符都是这个思路）。这里用 OneAsmr 的首字母 O：
  一个加粗的琥珀圆环（左上亮、右下深的玻璃渐变 + 一道镜面高光），环内三根
  短声波柱，高度不等 —— 既是字母，也读得成"声音在环里"。
  与 C 稿的区别：C 是细白环 + 五根彩色柱的"徽章"，M 是粗琥珀环 + 三根小白柱的"字母"。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 风格 M：字母 O 与声波">
  <title>OneAsmr — M「字母 O」</title>

  <defs>
    <radialGradient id="m-bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#1A2A56"/>
      <stop offset="58%" stop-color="#0E1A38"/>
      <stop offset="100%" stop-color="#060C1C"/>
    </radialGradient>
    <linearGradient id="m-ring" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0%" stop-color="#FFE3B8"/>
      <stop offset="50%" stop-color="#EFAE55"/>
      <stop offset="100%" stop-color="#BC7018"/>
    </linearGradient>
  </defs>

  <g id="background-layer">
    <rect width="108" height="108" fill="url(#m-bg)"/>
  </g>

  <g id="glyph-layer">
    <!-- 字母 O：粗环 -->
    <circle cx="54" cy="54" r="25" fill="none" stroke="url(#m-ring)" stroke-width="9"/>
    <!-- 左上镜面高光 -->
    <path d="M37.6,35.6 A25,25 0 0 1 62,28.2" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 环内三根声波柱（加大一点，48px 下才立得住） -->
    <g fill="#EDF2FF">
      <rect x="44.7" y="50" width="4.6" height="8" rx="2.3"/>
      <rect x="51.7" y="44" width="4.6" height="20" rx="2.3"/>
      <rect x="58.7" y="48" width="4.6" height="12" rx="2.3"/>
    </g>
  </g>
</svg>
