<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 风格探索 X ——「频谱栅格」  v2

  v1 只有 6 列、格子偏大，读起来像一根根方块柱状图。v2 改成 7 列 × 5 行、
  格子收到 4.8，列高 2/3/4/5/4/3/2；亮格按**行**走色（上暖金 → 下青绿），
  没点亮的格子留一层 5.5% 的底纹，小尺寸下自然消失、只剩一列列亮柱。
  方块边缘天生锐利，48px 不会像圆点阵那样糊掉。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 风格 X：频谱栅格">
