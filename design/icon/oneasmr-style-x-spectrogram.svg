      <stop offset="0%" stop-color="#152444"/>
      <stop offset="62%" stop-color="#0A1226"/>
      <stop offset="100%" stop-color="#04070E"/>
    </radialGradient>
    <radialGradient id="x-halo" cx="50%" cy="54%" r="50%">
      <stop offset="0%" stop-color="#4FE0D8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4FE0D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background-layer">
    <rect width="108" height="108" fill="url(#x-bg)"/>
    <circle cx="54" cy="54" r="42" fill="url(#x-halo)"/>
  </g>

