<?xml version="1.0" encoding="UTF-8"?>
<!--
  OneAsmr 风格探索 V ——「分割音场」（波分两色场）

  结构上又是一路：不是线、不是柱，而是一个**被声波切开的色场**——
  圆的上半是青绿→青的发光场，下半是深空蓝，交界处是一道会发光的声波缝。
  像示波器上的一条波形把画面分成"有声"与"安静"两半。
  上半/下半用同一段波形路径闭合后用圆形 clip-path 裁切（Android 矢量同样支持 clip-path）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108"
     role="img" aria-label="OneAsmr 风格 V：波分两色场">
  <title>OneAsmr — V「分割音场」</title>

  <defs>
    <radialGradient id="v-bg" cx="50%" cy="44%" r="74%">
      <stop offset="0%" stop-color="#101C3C"/>
      <stop offset="62%" stop-color="#080F22"/>
      <stop offset="100%" stop-color="#04060C"/>
    </radialGradient>
    <linearGradient id="v-top" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2FE3D2"/>
      <stop offset="100%" stop-color="#2C8CF0"/>
    </linearGradient>
    <linearGradient id="v-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A34"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <clipPath id="v-clip"><circle cx="54" cy="54" r="30"/></clipPath>
  </defs>

  <g id="background-layer">
    <rect width="108" height="108" fill="url(#v-bg)"/>
  </g>

  <g id="glyph-layer">
    <g clip-path="url(#v-clip)">
      <!-- 上半：发光色场 -->
      <path fill="url(#v-top)"
            d="M22.0,55.0 L23.07,53.29 L24.13,51.64 L25.2,50.1 L26.27,48.69 L27.33,47.46 L28.4,46.42
               L29.47,45.61 L30.53,45.05 L31.6,44.73 L32.67,44.67 L33.73,44.86 L34.8,45.3 L35.87,45.97
               L36.93,46.86 L38.0,47.93 L39.07,49.16 L40.13,50.52 L41.2,51.97 L42.27,53.48 L43.33,55.0
               L44.4,56.5 L45.47,57.95 L46.53,59.3 L47.6,60.53 L48.67,61.6 L49.73,62.5 L50.8,63.2
               L51.87,63.69 L52.93,63.96 L54.0,64.0 L55.07,63.82 L56.13,63.43 L57.2,62.84 L58.27,62.07
               L59.33,61.13 L60.4,60.05 L61.47,58.87 L62.53,57.62 L63.6,56.31 L64.67,55.0 L65.73,53.71
               L66.8,52.47 L67.87,51.31 L68.93,50.26 L70.0,49.34 L71.07,48.58 L72.13,47.99 L73.2,47.58
               L74.27,47.36 L75.33,47.33 L76.4,47.49 L77.47,47.84 L78.53,48.35 L79.6,49.01 L80.67,49.81
               L81.73,50.73 L82.8,51.73 L83.87,52.8 L84.93,53.89 L86.0,55.0 L86,24 L22,24 Z"/>
      <!-- 下半：深空场 -->
      <path fill="url(#v-bottom)"
            d="M22.0,55.0 L23.07,53.29 L24.13,51.64 L25.2,50.1 L26.27,48.69 L27.33,47.46 L28.4,46.42
               L29.47,45.61 L30.53,45.05 L31.6,44.73 L32.67,44.67 L33.73,44.86 L34.8,45.3 L35.87,45.97
               L36.93,46.86 L38.0,47.93 L39.07,49.16 L40.13,50.52 L41.2,51.97 L42.27,53.48 L43.33,55.0
               L44.4,56.5 L45.47,57.95 L46.53,59.3 L47.6,60.53 L48.67,61.6 L49.73,62.5 L50.8,63.2
               L51.87,63.69 L52.93,63.96 L54.0,64.0 L55.07,63.82 L56.13,63.43 L57.2,62.84 L58.27,62.07
               L59.33,61.13 L60.4,60.05 L61.47,58.87 L62.53,57.62 L63.6,56.31 L64.67,55.0 L65.73,53.71
               L66.8,52.47 L67.87,51.31 L68.93,50.26 L70.0,49.34 L71.07,48.58 L72.13,47.99 L73.2,47.58
               L74.27,47.36 L75.33,47.33 L76.4,47.49 L77.47,47.84 L78.53,48.35 L79.6,49.01 L80.67,49.81
               L81.73,50.73 L82.8,51.73 L83.87,52.8 L84.93,53.89 L86.0,55.0 L86,86 L22,86 Z"/>
      <!-- 下半靠近交界处的余晖，让分界更"发光" -->
      <path fill="none" stroke="#2FE3D2" stroke-opacity="0.18" stroke-width="6"
            d="M22.0,55.0 L25.2,50.1 L28.4,46.42 L31.6,44.73 L34.8,45.3 L38.0,47.93 L41.2,51.97
               L44.4,56.5 L47.6,60.53 L50.8,63.2 L54.0,64.0 L57.2,62.84 L60.4,60.05 L63.6,56.31
               L66.8,52.47 L70.0,49.34 L73.2,47.58 L76.4,47.49 L79.6,49.01 L82.8,51.73 L86.0,55.0"/>
    </g>
    <!-- 分界缝：一层辉光 + 一层亮线，压在最上面 -->
    <path fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="6.5" stroke-linecap="round"
          d="M22.0,55.0 L25.2,50.1 L28.4,46.42 L31.6,44.73 L34.8,45.3 L38.0,47.93 L41.2,51.97
             L44.4,56.5 L47.6,60.53 L50.8,63.2 L54.0,64.0 L57.2,62.84 L60.4,60.05 L63.6,56.31
             L66.8,52.47 L70.0,49.34 L73.2,47.58 L76.4,47.49 L79.6,49.01 L82.8,51.73 L86.0,55.0"/>
    <path fill="none" stroke="#EAFBFF" stroke-width="2.4" stroke-linecap="round"
          d="M22.0,55.0 L25.2,50.1 L28.4,46.42 L31.6,44.73 L34.8,45.3 L38.0,47.93 L41.2,51.97
             L44.4,56.5 L47.6,60.53 L50.8,63.2 L54.0,64.0 L57.2,62.84 L60.4,60.05 L63.6,56.31
             L66.8,52.47 L70.0,49.34 L73.2,47.58 L76.4,47.49 L79.6,49.01 L82.8,51.73 L86.0,55.0"/>
    <!-- 外圈：一圈极淡的边，帮助图标在深色壁纸上不糊掉 -->
    <circle cx="54" cy="54" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.3"/>
  </g>
</svg>
