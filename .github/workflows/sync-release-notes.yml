name: Sync release notes

# Curated release notes live in .github/release-notes/<version>.md (file name
# without the leading "v"). The Release workflow prefers those files over its
# auto-generated commit-subject notes; this workflow lets us refresh the body
# of an ALREADY published release after editing/fixing that file, without
# re-tagging or rebuilding.
on:
  push:
    branches: [main]
    paths:
      - '.github/release-notes/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.2.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and notes file
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              0000000000000000000000000000000000000000) BEFORE="HEAD~1" ;;
            esac
            CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- '.github/release-notes/*.md')"
            FILE="$(printf '%s\n' "$CHANGED" | tail -n 1)"
            if [ -z "$FILE" ]; then
              echo "::error::No release-notes file changed in this push"
              exit 1
            fi
            TAG="v$(basename "$FILE" .md)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=.github/release-notes/${TAG#v}.md" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          NOTES="${{ steps.resolve.outputs.notes }}"
          MISSING=0
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing notes file: $NOTES"
            MISSING=1
          fi
          if [ "$MISSING" = "0" ] && gh release edit "$TAG" --title "OneAsmr $TAG" --notes-file "$NOTES" >/tmp/gh-out 2>/tmp/gh-err; then
            echo "Release $TAG updated with $NOTES"
            exit 0
          fi
          {
            echo "## sync-release-notes diagnostics"
            echo ""
            echo "- TAG: \`$TAG\`"
            echo "- NOTES: \`$NOTES\`"
            echo "- gh version: $(gh --version | head -1)"
            echo "- GH_TOKEN present: $([ -n "${GH_TOKEN:-}" ] && echo yes || echo no)"
            echo ""
            echo '### stdout'
            echo '```'
            cat /tmp/gh-out 2>/dev/null || true
            echo '```'
            echo '### stderr'
            echo '```'
            cat /tmp/gh-err 2>/dev/null || true
            echo '```'
          } > /tmp/diag.md
          cat /tmp/diag.md
          # Logs need admin rights to download; publish the diagnostics on a
          # branch instead so the failure is inspectable from the repository.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/sync-notes-debug
          mkdir -p .github/diagnostics
          cp /tmp/diag.md .github/diagnostics/sync-notes.md
          git add .github/diagnostics/sync-notes.md
          git commit -m "chore(ci): sync-release-notes failure diagnostics"
          git push origin HEAD
          exit 1
