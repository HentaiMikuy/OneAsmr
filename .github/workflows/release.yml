name: Release

# Pushing a version tag (vX.Y.Z) builds the release APK and publishes it as
# a GitHub Release. The in-app updater polls the latest release API, so the
# tag name is the source of truth for the version number — keep it in sync
# with versionName in app/build.gradle.kts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signing secrets
        run: |
          for secret in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret (see README「自动更新与发布」)"
              exit 1
            fi
          done
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # Copy the APK with a friendly, versioned asset name (e.g.
      # OneAsmr-v0.2.0.apk) so downloads are self-describing.
      - name: Rename APK asset
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OneAsmr-v${VERSION}.apk"

      # Generate a structured release body from the commit log since the last
      # tag: grouped into features / fixes / other. On the very first release
      # (no previous tag) it lists the full history.
      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}"
          fi
          FEATS="$(git log --format='%s' --no-merges "$RANGE" | grep -E '^(feat|feature)(\(|:| )' || true)"
          FIXES="$(git log --format='%s' --no-merges "$RANGE" | grep -E '^(fix|bugfix)(\(|:| )' || true)"
          OTHERS="$(git log --format='%s' --no-merges "$RANGE" | grep -Ev '^(feat|feature|fix|bugfix)(\(|:| )' || true)"
          {
            echo "## v${VERSION}"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              echo "> 首个正式发布版本。"
              echo ""
            fi
            if [ -n "$FEATS" ]; then
              echo "### ✨ 新增"
              echo "$FEATS" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 修复"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 其他"
              echo "$OTHERS" | sed 's/^/- /'
              echo ""
            fi
            echo "---"
            echo "完整提交记录: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      # Curated notes win over the generated commit-subject list: the file is
      # .github/release-notes/<version>.md (no leading "v"). Keep the generated
      # body as the fallback when no curated file exists.
      - name: Prefer curated release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f ".github/release-notes/${VERSION}.md" ]; then
            cp ".github/release-notes/${VERSION}.md" /tmp/release_notes.md
            echo "Using curated release notes: .github/release-notes/${VERSION}.md"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OneAsmr ${{ github.ref_name }}
          files: dist/*.apk
          body_path: /tmp/release_notes.md
