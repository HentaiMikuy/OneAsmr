[versions]
# AGP 9.3.1 is the latest stable whose maximum supported API level is 37;
# it requires Gradle >= 9.5.0 (wrapper pinned to 9.7.0).
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.11"
core-ktx = "1.19.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
compose-bom = "2026.06.01"
navigation-compose = "2.9.8"
hilt = "2.60.1"
hilt-navigation-compose = "1.4.0"
room = "2.8.4"
# androidx.sqlite bundled driver: ships SQLite >= 3.42 with FTS5 + trigram,
# required because the Android framework SQLite has no FTS5 compiled in.
sqlite-bundled = "2.7.0"
# Paging 3 (Task 12 library grid/list): Room PagingSource + Compose integration.
paging = "3.5.0"
media3 = "1.10.1"
# NOTE: media3-decoder-flac / media3-decoder-opus are NOT published to any Maven
# repo by Google (native-code modules, source-build only, see media3 README).
# The coordinates below are the official ones for when we vendor/build them in
# task 17 (playback core); they are deliberately NOT referenced from the app
# module yet so dependency resolution stays green.
media3-decoder-flac = "1.10.1"
media3-decoder-opus = "1.10.1"
workmanager = "2.11.2"
datastore = "1.2.1"
coil = "3.5.0"
okhttp = "5.4.0"
retrofit = "3.0.0"
kotlinx-serialization = "1.11.0"
coroutines = "1.11.0"
jsoup = "1.23.1"
# TinyPinyin core: the canonical com.github.promeg:tinypinyin coordinate is
# unresolvable (JitPack's cached build for tag 2.0.3 only contains the lexicon
# modules; fresh lowercase builds fail on the dead jcenter repo). We use the
# byte-identical Maven Central republish io.github.biezhi:TinyPinyin (same
# upstream code, same com.github.promeg.pinyinhelper package).
tinypinyin = "2.0.3.RELEASE"
# Android asset lexicons from JitPack (case-sensitive capital repo name; its pom
# points at the dead lowercase core coordinate, excluded at the use site).
tinypinyin-lexicons = "2.0.3"
juniversalchardet = "2.5.0"
junit = "4.13.2"
mockwebserver = "5.4.0"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite-bundled" }

androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# Catalog-only, see note in [versions]: upstream publishes no binaries.
androidx-media3-decoder-flac = { group = "androidx.media3", name = "media3-decoder-flac", version.ref = "media3-decoder-flac" }
androidx-media3-decoder-opus = { group = "androidx.media3", name = "media3-decoder-opus", version.ref = "media3-decoder-opus" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
tinypinyin = { group = "io.github.biezhi", name = "TinyPinyin", version.ref = "tinypinyin" }
tinypinyin-android-asset-lexicons = { group = "com.github.promeg.TinyPinyin", name = "tinypinyin-android-asset-lexicons", version.ref = "tinypinyin-lexicons" }
juniversalchardet = { group = "com.github.albfernandez", name = "juniversalchardet", version.ref = "juniversalchardet" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
